[project]
name = "restaurant_forecast"
version = "0.1.0"
description = "Modular restaurant order forecasting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas==2.3.3",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "skforecast>=0.20.1",  # Fixed
    "statsmodels>=0.14",
    "click>=8.1",
]

[project.scripts]
forecast-cli = "cli.forecast_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["restaurant_forecast/src/restaurant_forecast"]  # Fix src layout

[dependency-groups]
dev = ["pytest==8.3.2", "mypy>=1.11", "ruff>=0.7.0", "pytest-cov"]
